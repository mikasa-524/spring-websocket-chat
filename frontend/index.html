<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>WebSocket Chat Demo</title>
  <style>
    body { font-family: Arial; max-width:800px; margin:20px;}
    #messages { border:1px solid #ddd; height:300px; overflow:auto; padding:10px; }
    .msg { margin:6px 0; }
    .meta { color:#666; font-size:12px; }
  </style>
</head>
<body>
  <h2>Chat Demo (Java Spring WebSocket)</h2>
  <div>
    <label>Username: <input id="username" value="user1"></label>
    <button id="btnLogin">Login & Connect</button>
  </div>
  <div style="margin-top:10px;">
    <input id="conversationId" value="room1" placeholder="conversationId">
  </div>
  <div id="messages"></div>
  <div style="margin-top:10px;">
    <input id="input" style="width:70%">
    <button id="send">Send</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
  <script>
    let stompClient = null;
    let token = null;
    document.getElementById('btnLogin').onclick = async () => {
      const username = document.getElementById('username').value;
      const res = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username})});
      const data = await res.json();
      token = data.token;
      connect();
    };

    function connect() {
      const socket = new SockJS('/ws');
      stompClient = Stomp.over(socket);
      stompClient.connect({'Authorization': 'Bearer ' + token}, function(frame) {
        console.log('Connected: ' + frame);
        const conv = document.getElementById('conversationId').value;
        stompClient.subscribe('/topic/conversation.' + conv, function(msg) {
          const payload = JSON.parse(msg.body);
          const el = document.createElement('div');
          el.className = 'msg';
          el.innerHTML = '<b>' + payload.sender + ':</b> ' + payload.content + '<div class="meta">' + payload.createdAt + '</div>';
          document.getElementById('messages').appendChild(el);
          document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        });
      }, function(err) {
        console.error('STOMP error', err);
      });
    }

    document.getElementById('send').onclick = () => {
      const conv = document.getElementById('conversationId').value;
      const content = document.getElementById('input').value;
      if (!stompClient) return alert('not connected');
      stompClient.send('/app/chat.send', {}, JSON.stringify({ conversationId: conv, content }));
      document.getElementById('input').value = '';
    };
  </script>
</body>
</html>
